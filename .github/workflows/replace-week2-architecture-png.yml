name: Replace architecture diagram with polished PNG

on:
  push:
    paths:
      - "docs/.week2_architecture_source.svg"
      - ".github/workflows/replace-week2-architecture-png.yml"

permissions:
  contents: write

jobs:
  render-and-replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install PNG rendering tools
        run: python -m pip install --upgrade cairosvg pillow

      - name: Render and optimise architecture PNG
        run: |
          python - <<'PY'
          import cairosvg
          from PIL import Image
          source = "docs/.week2_architecture_source.svg"
          target = "docs/week2_architecture_v1.png"
          cairosvg.svg2png(url=source, write_to="/tmp/architecture.png",
                           output_width=2000, output_height=1450)
          image = Image.open("/tmp/architecture.png").convert("RGB")
          image.quantize(colors=32, method=Image.Quantize.FASTOCTREE,
                         dither=Image.Dither.NONE).save(target, optimize=True)
          with Image.open(target) as check:
              check.verify()
          print(f"Created {target}: {image.size}")
          PY

      - name: Replace PNG and clean temporary SVG source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/week2_architecture_v1.png
          git rm docs/.week2_architecture_source.svg
          git rm .github/workflows/replace-week2-architecture-png.yml
          git commit -m "Polish and replace Week 2 architecture PNG"
          git push origin HEAD:main
