<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 670" width="1380" height="670"><rect x="0" y="0" width="1380" height="670" rx="0" fill="#f4f8fb" stroke="none" stroke-width="2" /><text x="50" y="49" fill="#172d42" font-family="Arial, sans-serif" font-size="42" font-weight="700" dominant-baseline="central">SmartPark AI Week 3 data pipeline</text><text x="50" y="97" fill="#425b70" font-family="Arial, sans-serif" font-size="24" font-weight="400" dominant-baseline="central">FYP footage and detector pilot to Topic 4</text><rect x="50" y="138" width="380" height="140" rx="16" fill="#ffffff" stroke="#9db1c1" stroke-width="2" /><text x="72" y="175" fill="#172d42" font-family="Arial, sans-serif" font-size="29" font-weight="700" dominant-baseline="central">1  Source</text><text x="72" y="217" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">85 detector-pilot images</text><text x="72" y="246" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">200 indexed camera replay frames</text><rect x="500" y="138" width="380" height="140" rx="16" fill="#ffffff" stroke="#9db1c1" stroke-width="2" /><text x="522" y="175" fill="#172d42" font-family="Arial, sans-serif" font-size="29" font-weight="700" dominant-baseline="central">2  Ingest</text><text x="522" y="217" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Load the private ZIP</text><text x="522" y="246" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Match stable image IDs and paths</text><rect x="950" y="138" width="380" height="140" rx="16" fill="#ffffff" stroke="#9db1c1" stroke-width="2" /><text x="972" y="175" fill="#172d42" font-family="Arial, sans-serif" font-size="29" font-weight="700" dominant-baseline="central">3  Inspect</text><text x="972" y="217" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Check source roles and dimensions</text><text x="972" y="246" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Compare native and preview geometry</text><rect x="950" y="350" width="380" height="140" rx="16" fill="#ffffff" stroke="#9db1c1" stroke-width="2" /><text x="972" y="387" fill="#172d42" font-family="Arial, sans-serif" font-size="29" font-weight="700" dominant-baseline="central">4  Prepare</text><text x="972" y="429" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Retain source JPEG geometry</text><text x="972" y="458" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Index labels, timing and provenance</text><rect x="500" y="350" width="380" height="140" rx="16" fill="#ffffff" stroke="#9db1c1" stroke-width="2" /><text x="522" y="387" fill="#172d42" font-family="Arial, sans-serif" font-size="29" font-weight="700" dominant-baseline="central">5  Validate</text><text x="522" y="429" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Verify RGB decoding and SHA-256</text><text x="522" y="458" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Repeat the ordered export</text><rect x="50" y="350" width="380" height="140" rx="16" fill="#dff1ee" stroke="#126c65" stroke-width="2" /><text x="72" y="387" fill="#126c65" font-family="Arial, sans-serif" font-size="29" font-weight="700" dominant-baseline="central">6  Record lineage</text><text x="72" y="429" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Publish metadata and run manifests</text><text x="72" y="458" fill="#425b70" font-family="Arial, sans-serif" font-size="20" font-weight="400" dominant-baseline="central">Hand 285 verified records to Topic 4</text><line x1="430" y1="208" x2="493" y2="208" stroke="#126c65" stroke-width="4" /><polygon points="493,208 478,216 478,200" fill="#126c65" /><line x1="880" y1="208" x2="943" y2="208" stroke="#126c65" stroke-width="4" /><polygon points="943,208 928,216 928,200" fill="#126c65" /><line x1="1140" y1="278" x2="1140" y2="343" stroke="#126c65" stroke-width="4" /><polygon points="1140,343 1132,328 1148,328" fill="#126c65" /><line x1="950" y1="420" x2="887" y2="420" stroke="#126c65" stroke-width="4" /><polygon points="887,420 902,412 902,428" fill="#126c65" /><line x1="500" y1="420" x2="437" y2="420" stroke="#126c65" stroke-width="4" /><polygon points="437,420 452,412 452,428" fill="#126c65" /><rect x="50" y="542" width="1280" height="74" rx="12" fill="#e4eef5" stroke="none" stroke-width="2" /><text x="72" y="580" fill="#172d42" font-family="Arial, sans-serif" font-size="23" font-weight="400" dominant-baseline="central">Missing image, duplicate identity or failed verification: stop and review the source.</text></svg>