<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1370" viewBox="0 0 1900 1370"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker><linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EDE9FE"/><stop offset="1" stop-color="#DBEAFE"/></linearGradient></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="35" y="25" width="1830" height="95" rx="17" fill="url(#head)" stroke="#6D28D9" stroke-width="3"/><text x="950" y="65" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#1E1B4B" text-anchor="middle">SMARTPARK AI — REQUIREMENTS-DRIVEN APPLICATION ARCHITECTURE</text><text x="950" y="98" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#475569" text-anchor="middle">Begin with the basic interaction. Add only capabilities justified by FR, NFR and Responsible AI requirements.</text><rect x="35" y="145" width="1830" height="220" rx="17" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="70" y="185" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A" text-anchor="start">V1 (SIMPLE) — USER QUERY → APPLICATION → AI CAPABILITY → RESPONSE</text><text x="70" y="214" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">A minimum starting point for the driver / operator interaction</text><rect x="75" y="250" width="330" height="90" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="240.0" y="284" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">DRIVER / OPERATOR</text><text x="240.0" y="312" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="240.0" dy="0">Requests an available bay</tspan><tspan x="240.0" dy="20">or views parking occupancy</tspan></text><rect x="520" y="250" width="330" height="90" rx="14" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/><text x="685.0" y="284" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#DB2777" text-anchor="middle">SMARTPARK APPLICATION</text><text x="685.0" y="312" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="685.0" dy="0">Receives the request and</tspan><tspan x="685.0" dy="20">presents the result</tspan></text><rect x="965" y="250" width="330" height="90" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1130.0" y="284" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">PARKING AI CAPABILITY</text><text x="1130.0" y="312" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="1130.0" dy="0">Analyses the parking scene</tspan><tspan x="1130.0" dy="20">and determines occupancy</tspan></text><rect x="1410" y="250" width="330" height="90" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="1575.0" y="284" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#7C3AED" text-anchor="middle">RESPONSE</text><text x="1575.0" y="312" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="1575.0" dy="0">Occupancy result or</tspan><tspan x="1575.0" dy="20">available-bay guidance</tspan></text><line x1="405" y1="295" x2="512" y2="295" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><line x1="850" y1="295" x2="957" y2="295" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><line x1="1295" y1="295" x2="1402" y2="295" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><rect x="35" y="385" width="1830" height="75" rx="13" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/><text x="62" y="415" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9A3412" text-anchor="start">WHY ADD COMPONENTS?</text><text x="62" y="445" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#7C2D12" text-anchor="start">The basic flow does not explicitly support camera input, defined bay regions, tracking across frames, vacant-only selection, uncertain-track handling or footage minimisation.</text><rect x="35" y="480" width="1830" height="510" rx="17" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="70" y="520" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A" text-anchor="start">V1 (REQUIREMENTS-DRIVEN) — COMPONENTS ADDED ONLY WHERE JUSTIFIED</text><text x="70" y="548" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Runtime flow for the miniature parking prototype</text><rect x="65" y="600" width="205" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="167.5" y="635" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2563EB" text-anchor="middle">USER</text><text x="167.5" y="668" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="167.5" dy="0">Driver / visitor</tspan><tspan x="167.5" dy="22">Parking operator</tspan></text><rect x="330" y="600" width="240" height="110" rx="14" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/><text x="450.0" y="635" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#DB2777" text-anchor="middle">SMARTPARK APP / UI</text><text x="450.0" y="668" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="450.0" dy="0">Request a vacant bay</tspan><tspan x="450.0" dy="22">View current occupancy</tspan></text><rect x="635" y="600" width="275" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="772.5" y="635" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#2563EB" text-anchor="middle">VISION AI CAPABILITY</text><text x="772.5" y="668" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="772.5" dy="0">FR1: bay occupancy</tspan><tspan x="772.5" dy="22">FR2: vehicle tracking</tspan></text><rect x="975" y="600" width="300" height="110" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="1125.0" y="635" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#7C3AED" text-anchor="middle">PARKING STATE &amp; GUIDANCE</text><text x="1125.0" y="668" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="1125.0" dy="0">FR3: update bay status</tspan><tspan x="1125.0" dy="22">FR4–FR5: choose and guide</tspan></text><rect x="1340" y="600" width="455" height="110" rx="14" fill="#FFEDD5" stroke="#D97706" stroke-width="2"/><text x="1567.5" y="635" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#D97706" text-anchor="middle">RESPONSIBLE CHECKS &amp; RESPONSE</text><text x="1567.5" y="668" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="1567.5" dy="0">RAI1–2: block unsafe / uncertain guidance</tspan><tspan x="1567.5" dy="22">Show bay ID + location, direction or no bay</tspan></text><line x1="270" y1="655" x2="322" y2="655" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><line x1="570" y1="655" x2="627" y2="655" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><line x1="910" y1="655" x2="967" y2="655" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><line x1="1275" y1="655" x2="1332" y2="655" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><rect x="70" y="805" width="260" height="105" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="200.0" y="839" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#16A34A" text-anchor="middle">CAMERA INPUT</text><text x="200.0" y="871" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="200.0" dy="0">Images / video frames from</tspan><tspan x="200.0" dy="20">the miniature parking scene</tspan></text><rect x="390" y="805" width="280" height="105" rx="14" fill="#FFEDD5" stroke="#D97706" stroke-width="2"/><text x="530.0" y="839" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#D97706" text-anchor="middle">PRIVACY BOUNDARY</text><text x="530.0" y="871" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="530.0" dy="0">Retain only required scene data;</tspan><tspan x="530.0" dy="20">exclude incidental personal data</tspan></text><rect x="980" y="805" width="300" height="105" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><text x="1130.0" y="839" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">DEFINED PARKING LAYOUT</text><text x="1130.0" y="871" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="1130.0" dy="0">Bay IDs, boundaries and positions</tspan><tspan x="1130.0" dy="20">for occupancy and guidance</tspan></text><line x1="330" y1="858" x2="390" y2="858" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><line x1="670" y1="832" x2="760" y2="710" stroke="#D97706" stroke-width="4" marker-end="url(#arr)"/><text x="720" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#D97706" text-anchor="middle">filtered frames</text><line x1="1130" y1="805" x2="1130" y2="718" stroke="#64748B" stroke-width="4" marker-end="url(#arr)" stroke-dasharray="9 7"/><text x="1200" y="765" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#64748B" text-anchor="middle">bay definitions</text><text x="1225" y="740" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#16A34A" text-anchor="middle">Latest occupancy + temporary track state</text><rect x="35" y="1015" width="1830" height="230" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-dasharray="10 8"/><text x="70" y="1055" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start">EVALUATION — TESTING SUPPORT, NOT AN EXTRA USER-FACING RUNTIME FEATURE</text><rect x="70" y="1090" width="500" height="115" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="320.0" y="1126" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">LABELLED TEST INPUTS</text><text x="320.0" y="1162" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="320.0" dy="0">Held-out frames, annotated video clips,</tspan><tspan x="320.0" dy="21">repeatable parking scenarios</tspan></text><rect x="700" y="1090" width="500" height="115" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="950.0" y="1126" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">MEASURE ACTUAL RESULTS</text><text x="950.0" y="1162" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="950.0" dy="0">Macro-F1, track association, latency,</tspan><tspan x="950.0" dy="21">successful runs and RAI control checks</tspan></text><rect x="1330" y="1090" width="455" height="115" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="1557.5" y="1126" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">COMPARE WITH TARGETS</text><text x="1557.5" y="1162" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="middle"><tspan x="1557.5" dy="0">FR / NFR / RAI thresholds and evaluation</tspan><tspan x="1557.5" dy="21">criteria from the project documents</tspan></text><line x1="570" y1="1147" x2="692" y2="1147" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><line x1="1200" y1="1147" x2="1322" y2="1147" stroke="#475569" stroke-width="4" marker-end="url(#arr)"/><rect x="35" y="1260" width="1830" height="85" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="65" y="1292" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start">LEGEND</text><rect x="190" y="1274" width="34" height="28" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="235" y="1296" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">User / AI capability</text><rect x="490" y="1274" width="34" height="28" rx="5" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/><text x="535" y="1296" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">Application / interface</text><rect x="830" y="1274" width="34" height="28" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/><text x="875" y="1296" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">Input / state data</text><rect x="1170" y="1274" width="34" height="28" rx="5" fill="#FFEDD5" stroke="#D97706" stroke-width="1.5"/><text x="1215" y="1296" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">Privacy / Responsible AI control</text><rect x="1550" y="1274" width="34" height="28" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="1595" y="1296" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">Decision / response</text></svg>